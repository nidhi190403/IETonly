<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Styling</title>
</head>
<body>
    <h2>Change Paragraph Color & Style</h2>
    <p id="p1">This is paragraph 1.</p>
    <p id="p2">This is paragraph 2.</p>
    <p id="p3">This is paragraph 3.</p>
    <p id="p4">This is paragraph 4.</p>
    <br>
    Select Color:
    <input type="color" id="colorPicker">

    <button onclick="changeStyle()">Apply Style</button>

    <script>
        function changeStyle() {
            let color = document.getElementById("colorPicker").value;

            let p1 = document.getElementById("p1");
            let p2 = document.getElementById("p2");
            let p3 = document.getElementById("p3");
            let p4 = document.getElementById("p4");

            p1.style.color = color;
            p2.style.color = color;
            p3.style.color = color;
            p4.style.color = color;
            p1.style.fontWeight = "bold";
            p2.style.fontWeight = "bold";
            p3.style.fontWeight = "bold";
            p4.style.fontWeight = "bold";
        }
    </script>
</body>
</html>
