<!DOCTYPE html>
<html>
<head>
    <title>Text Fields and Image Styling</title>

    <style>
        /* Style for input fields */
        .input-container input {
            margin-left: 10px;
            margin-right: 10px;
            border: 2px solid blue;
            padding: 8px;
        }

        /* Keep inputs in one line */
        .input-container {
            display: flex;
            justify-content: center;
        }

        /* Style for image */
        img {
            margin-top: 30px;
            border: 3px solid red;
            border-radius: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>

</head>
<body>

    <div class="input-container">
        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
        <input type="text" placeholder="Username">
    </div>

    <img src="sun.jpeg" alt="Sample Image">

</body>
</html>
